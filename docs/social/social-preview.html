<!doctype html>

    <style>
      /* Generated by docs/social/generate.mjs. Edit that, not this. */
      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        width: 1280px;
        height: 640px;
        overflow: hidden;
        font-family: Poppins, "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
        color: #1f1e33;
        background: #ffffff;
      }

      .card {
        position: relative;
        width: 1280px;
        height: 640px;
        display: flex;
        align-items: center;
        /* The 40pt safe border GitHub asks for, plus a little more. */
        padding: 64px;
        background:
          radial-gradient(760px 520px at 88% 6%, rgba(116, 85, 221, 0.16), transparent 62%),
          radial-gradient(560px 420px at 4% 96%, rgba(81, 43, 212, 0.09), transparent 60%),
          linear-gradient(135deg, #ffffff 38%, #f4f1fd 100%);
      }

      /* The isometric grid Isoflow draws behind a diagram, faintly. */
      .card::before {
        content: "";
        position: absolute;
        inset: 0;
        background-image:
          repeating-linear-gradient(26.57deg, #dce0e8 0 1px, transparent 1px 52px),
          repeating-linear-gradient(-26.57deg, #dce0e8 0 1px, transparent 1px 52px);
        opacity: 0.5;
        mask-image: radial-gradient(circle at 62% 46%, #000 0%, transparent 78%);
      }

      .card > * { position: relative; }

      .copy { width: 640px; flex: 0 0 auto; }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        font-size: 17px;
        font-weight: 600;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #512bd4;
      }

      .eyebrow::before {
        content: "";
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: linear-gradient(135deg, #512bd4, #7455dd);
      }

      h1 {
        margin-top: 22px;
        font-size: 78px;
        line-height: 1.02;
        font-weight: 700;
        letter-spacing: -0.035em;
      }

      h1 span { color: #512bd4; }

      p {
        margin-top: 20px;
        font-size: 27px;
        line-height: 1.42;
        color: #66697e;
        max-width: 30ch;
      }

      .chips { display: flex; gap: 12px; margin-top: 34px; flex-wrap: wrap; }

      .chip {
        font-family: "Fira Code", ui-monospace, SFMono-Regular, Consolas, monospace;
        font-size: 19px;
        padding: 11px 18px;
        border-radius: 10px;
        background: #ffffff;
        border: 1px solid #dce0e8;
        box-shadow: 0 2px 10px rgba(31, 30, 51, 0.06);
      }

      .chip--accent {
        color: #ffffff;
        background: linear-gradient(135deg, #512bd4, #7455dd);
        border-color: transparent;
      }

      .diagram {
        position: relative;
        width: 520px;
        height: 440px;
        margin-left: auto;
        margin-right: 8px;
      }

      .diagram svg { position: absolute; inset: 0; overflow: visible; }

      .node { position: absolute; text-align: center; }

      .node img { display: block; filter: drop-shadow(0 10px 16px rgba(31, 30, 51, 0.18)); }

      .node figcaption {
        margin-top: 2px;
        font-size: 18px;
        font-weight: 600;
        color: #1f1e33;
      }
    </style>
  </head>
