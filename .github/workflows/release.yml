name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  CI: true
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_SYSTEM_CONSOLE_ALLOW_ANSI_COLOR_REDIRECTION: true

permissions:
  contents: read
  id-token: write # required for NuGet Trusted Publishing

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Derive version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build
        run: dotnet build AspireTopology.slnx --configuration Release

      - name: Test
        run: dotnet test AspireTopology.slnx --configuration Release --no-build

      - name: Pack
        run: |
          for project in src/*/*.csproj; do
            dotnet pack "$project" --configuration Release --no-build --output ./nupkg
          done

      - name: NuGet login (trusted publishing)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push packages
        shell: pwsh
        run: |
          $packages = Get-ChildItem nupkg -Filter *.nupkg
          if ($packages.Count -eq 0) { Write-Error 'No packages found to push.'; exit 1 }
          foreach ($pkg in $packages) {
            dotnet nuget push $pkg.FullName `
              --api-key ${{ steps.login.outputs.NUGET_API_KEY }} `
              --source https://api.nuget.org/v3/index.json `
              --skip-duplicate
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
